name: Render D2 Diagrams

on:
  push:
    paths:
      - 'diagrams/*.d2'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Render all D2 files to SVG
        run: |
          for f in diagrams/*.d2; do
            name="${f%.d2}"
            d2 "$f" "${name}.svg"
            echo "Rendered $f → ${name}.svg"
          done

      - name: Commit rendered SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagrams/*.svg
          git diff --cached --quiet || git commit -m "ci: render D2 diagrams to SVG"
          git push
